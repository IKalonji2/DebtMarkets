<div class="dashboard-container">
  <div class="main-content">
    <div class="chart-section">
      <div class="chart-container">
        <canvas #chartCanvas></canvas>
      </div>
    </div>

    <div class="data-section">
      <div class="performance-stats">
        <h2>Performance Overview</h2>
        <p><strong>Current Profit/Loss:</strong> $2,500</p>
        <p><strong>Collection Rate:</strong> 85%</p>
        <p><strong>Investor Interest:</strong> 120 investors</p>
      </div>

      <div class="actions">
        <!-- Disable Buy button if conditions are not met -->
        <button class="buy-btn" [disabled]="isBuyButtonDisabled()">Buy</button>
        <button class="sell-btn">Sell</button>
      </div>
    </div>
  </div>
</div>
