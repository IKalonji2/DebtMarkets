<section class="overview">
  <h2>Overview</h2>
  <div class="card">
    <h2>Portfolio</h2>
    <div *ngFor="let portfolio of portfolios" class="portfolio-card">
      <h3>{{ portfolio.name }}</h3>
      <p>Status: {{ portfolio.rating }}</p>
      <p>Value: {{ portfolio.value }}</p>
      <p>Status: {{ portfolio.status }}</p>
      <button *ngIf="portfolio.status === 'evaluated'" (click)="startAuction(portfolio.id)">Start Auction</button>
    </div>
  </div>
</section>
