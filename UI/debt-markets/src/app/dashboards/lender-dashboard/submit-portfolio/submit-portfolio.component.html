<section class="submit-npl">
  <h2>Submit Non-Performing Loan Book</h2>
  <div class="form-container">
    <h3>{{ formTitle }}</h3>

    <div class="step-overlay" *ngIf="loading">
      <div class="step-content">
        <h4>Submission Progress</h4>

        <ul class="checklist">
          <li *ngFor="let step of steps; let i = index">
            <input type="checkbox" [disabled]="true" [checked]="step.completed" />
            <span [class.completed]="step.completed">{{ step.label }}</span>
          </li>
        </ul>
      </div>
    </div>

    <form #portfolioForm="ngForm" (ngSubmit)="onFormSubmit(portfolioForm.value)" novalidate>
      <div *ngFor="let field of formConfig" class="form-group">
        <label [for]="field.name">{{ field.label }}</label>

        <ng-container *ngIf="field.type !== 'file'">
          <input
            [type]="field.type"
            [id]="field.name"
            [name]="field.name"
            ngModel
            #ngField="ngModel"
            [required]="field.validators.includes('required')"
            [min]="field.validators.includes('min:1') ? 1 : null"
            class="form-control"
          />
          <div *ngIf="ngField.invalid && ngField.touched" class="error-message">
            {{ field.errorMessage }}
          </div>
        </ng-container>

        <ng-container *ngIf="field.type === 'file'">
          <input
            [type]="field.type"
            [id]="field.name"
            [name]="field.name"
            [accept]="field.accept"
            (change)="onFileChange($event)"
            #fileInput
            class="form-control"
          />
          <div *ngIf="!selectedFile" class="error-message">
            {{ field.errorMessage }}
          </div>
        </ng-container>
      </div>

      <div class="button-wrapper">
        <button type="submit" [disabled]="!portfolioForm.valid || !selectedFile">
          Submit
        </button>
      </div>
    </form>
  </div>
</section>
