<div class="open-trades">
  <h2>Open Trades</h2>
  <table>
    <thead>
      <tr>
        <th>Bundle ID</th>
        <th>Total Value</th>
        <th>Risk Level</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let trade of trades">
        <td>{{ trade.bundleId }}</td>
        <td>{{ trade.totalValue | currency }}</td>
        <td>{{ trade.riskLevel }}</td>
        <td>
          <button (click)="investInBundle(trade.bundleId)">Invest</button>
        </td>
      </tr>
    </tbody>
</table>
</div>
