<h1>Active Bids</h1>

<section>
  <h2>Ongoing Auctions</h2>
  <ul>
    <li *ngFor="let bid of activeBids" (click)="viewBidDetails(bid)">
      <h3>{{ bid.auctionName }}</h3>
      <p>Amount: {{ bid.amount | currency }}</p>
      <p>Status: {{ bid.status }}</p>
    </li>
  </ul>
</section>

<section *ngIf="selectedBid">
  <h2>Bid Details</h2>
  <h3>{{ selectedBid.auctionName }}</h3>
  <p>Amount: {{ selectedBid.amount | currency }}</p>
  <p>Status: {{ selectedBid.status }}</p>
  <button (click)="placeBid(selectedBid)">Place Bid</button>
  <button (click)="cancelBid(selectedBid)">Cancel Bid</button>
</section>
